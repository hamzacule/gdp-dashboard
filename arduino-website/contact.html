<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact form to reach Arduino Hub." />
  <title>Contact • Arduino Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body data-page="contact">
  <header class="header">
    <div class="container navbar">
      <a href="/arduino-website/index.html" class="brand" aria-label="Arduino Hub home">
        <span class="logo">A</span>
        <span class="name">Arduino Hub</span>
      </a>
      <nav>
        <button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-navigation">☰</button>
        <div class="nav-links" id="primary-navigation">
          <a href="/arduino-website/index.html" data-page="home">Home</a>
          <a href="/arduino-website/projects.html" data-page="projects">Projects</a>
          <a href="/arduino-website/components.html" data-page="components">Components</a>
          <a href="/arduino-website/tutorials.html" data-page="tutorials">Tutorials</a>
          <a href="/arduino-website/contact.html" data-page="contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title reveal">Contact Us</h1>
      <p class="section-subtitle reveal">Have a question or suggestion? Send us a message.</p>

      <form id="contact-form" class="form reveal" novalidate>
        <div class="row">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" class="input" placeholder="Your name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="input" placeholder="you@example.com" required />
          </div>
        </div>
        <div>
          <label for="subject">Subject</label>
          <input id="subject" name="subject" class="input" placeholder="How can we help?" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" class="textarea" placeholder="Write your message..." required></textarea>
          <div class="hint">We usually reply within 1–2 business days.</div>
        </div>
        <div>
          <button class="button button-primary" type="submit">Send Message</button>
        </div>
        <div id="contact-alert" class="alert" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="links">
        <a href="/arduino-website/index.html">Home</a>
        <a href="/arduino-website/projects.html">Projects</a>
        <a href="/arduino-website/components.html">Components</a>
        <a href="/arduino-website/tutorials.html">Tutorials</a>
        <a href="/arduino-website/contact.html">Contact</a>
      </div>
      <div class="spacer"></div>
      <div class="muted">© <span id="year"></span> Arduino Hub.</div>
    </div>
  </footer>

  <script src="./assets/js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
</body>
</html>
